# Office VPN Production Configuration
java.version=25
server.host=0.0.0.0
server.port=8443
server.maxClients=50
session.timeoutMinutes=30
session.absoluteTimeoutMinutes=480
db.path=office_vpn.db
device.maxPerUser=3

# Tunneling Configuration
tunnel.mode=SPLIT
tunnel.full.enabled=true
tunnel.split.officeDomains=office.local,officevpn.local

# DNS Leak Protection Configuration
dns.vpn=10.8.0.1
dns.leakProtection=true

# Bandwidth Governance Configuration (in Kbps)
bandwidth.defaultKbpsPerUser=10240
bandwidth.adminKbps=51200
bandwidth.employeeKbps=10240
bandwidth.enabled=true
