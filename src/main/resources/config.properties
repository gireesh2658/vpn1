# Office VPN Production Configuration
java.version=25
server.host=0.0.0.0
server.port=8443
server.maxClients=50
session.timeoutMinutes=30
session.absoluteTimeoutMinutes=480

# MySQL Persistence Configuration
db.host=127.0.0.1
db.port=3306
db.name=office_vpn
db.user=root
db.password=
db.pool.maxSize=12
# Optional full JDBC URL override (takes precedence over db.host/db.port/db.name if non-empty):
db.url=

device.maxPerUser=3

# Tunneling Configuration
tunnel.mode=SPLIT
tunnel.full.enabled=true
tunnel.split.officeDomains=office.local,officevpn.local

# DNS Leak Protection Configuration
dns.vpn=10.8.0.1
dns.leakProtection=true

# Bandwidth & Governance Extensions
bandwidth.defaultKbpsPerUser=10240
bandwidth.adminKbps=51200
bandwidth.employeeKbps=10240
bandwidth.enabled=true
compression.enabled=true
siteToSite.enabled=true
