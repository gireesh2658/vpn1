# Office VPN Production Configuration
java.version=25
server.host=0.0.0.0
server.port=8443
server.maxClients=50
server.dataDir=server_data
vault.rootDir=server_vaults
session.timeoutMinutes=30
session.absoluteTimeoutMinutes=480

# Client & Fingerprint Store Defaults
client.defaultHost=127.0.0.1
client.fingerprintStoreFile=known_gateways.properties

# MySQL Persistence Configuration
db.host=127.0.0.1
db.port=3306
db.name=office_vpn
db.user=root
db.password=
db.pool.maxSize=12
# Optional full JDBC URL override (takes precedence over db.host/db.port/db.name if non-empty):
db.url=

device.maxPerUser=3

# Tunneling & Subnet Configuration
vpn.gatewayVirtualIp=10.8.0.1
vpn.subnet.prefix=10.8.0.
vpn.branchSubnet.prefix=10.9.0.
tunnel.mode=SPLIT
tunnel.full.enabled=true
tunnel.split.officeDomains=office.local,officevpn.local
tunnel.split.officeSubnets=10.8.0.0/24,10.9.0.0/24
tunnel.split.bypassRoutes=127.0.0.1,localhost,::1

# DNS Leak Protection Configuration
dns.vpn=10.8.0.1
dns.leakProtection=true

# Bandwidth & Governance Extensions
bandwidth.defaultKbpsPerUser=10240
bandwidth.adminKbps=51200
bandwidth.employeeKbps=10240
bandwidth.enabled=true
compression.enabled=true
siteToSite.enabled=true
